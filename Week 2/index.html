<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Modern E-Commerce store — Week 2 internship project" />
  <title>ShopVibe | E-Commerce Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style1.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">🛍️ <span>ShopVibe</span></div>
      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
      </nav>
      <div class="cart-icon" id="cart-icon">
        🛒 <span class="cart-badge" id="cart-count">0</span>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <p class="hero-sub">🔥 Limited Time Deals</p>
      <h1>Shop the Latest <br><span class="gradient-text">Trends</span></h1>
      <p class="hero-desc">Discover premium fashion picks at unbeatable prices.</p>
      <a href="#products" class="cta-btn">Shop Now →</a>
    </div>
    <div class="hero-image">🛍️</div>
  </section>

  <section id="products">
    <div class="section-header">
      <h2>Featured Products</h2>
      <p>Handpicked just for you</p>
    </div>
    <div class="product-grid" id="product-list"></div>
  </section>

  <div class="cart-toast" id="cart-toast">✅ Added to cart!</div>

  <footer>
    <p>© 2024 ShopVibe — Week 2 Project &nbsp;|&nbsp; Built with ❤️</p>
  </footer>

  <script src="script1.js"></script>
</body>
</html>
